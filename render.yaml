services:
  - type: web
    name: axtask-prod
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run build
    # npm run start runs scripts/production-start.mjs: guarded startup checks → SQL migrations → dist/index.js.
    # Drizzle schema push is intentionally disabled in production startup by default.
    startCommand: npm run start
    healthCheckPath: /health
    # Keep production re-entry manual while the database recovery incident is open.
    # A merge to main must not wake or redeploy the suspended service by itself.
    # Re-enabling auto-deploy is a separate operator decision after R9 observation.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FORCE_HTTPS
        value: "true"
      # Disable Drizzle schema push during production startup. Startup should
      # boot the app or fail on explicit env/migration/readiness gates, not on
      # interactive ORM prompts. Run db:push manually from an interactive shell.
      - key: SKIP_DB_PUSH_ON_START
        value: "true"
      # Set CANONICAL_HOST to your primary domain (for unknown host redirects).
      # Keep REPLIT_FALLBACK_HOST set so rollback is instant.
      - key: CANONICAL_HOST
        sync: false
      - key: REPLIT_FALLBACK_HOST
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SHEETS_API_KEY
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_REDIRECT_URI
        sync: false
      - key: AUTH_PROVIDER
        sync: false
      - key: REGISTRATION_MODE
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: AUTH_AUDIT_PEPPER
        sync: false
      - key: ARCHETYPE_ANALYTICS_SALT
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      # Admin Foundry controls: allow production access to /api/admin/foundry/*
      # while keeping admin role + step-up protection in place.
      - key: ENABLE_FOUNDRY
        value: "true"
      # OPERATOR BUDGET (optional):
      #   AXTASK_DB_SIZE_BUDGET_BYTES is an operator-selected operational/spend
      #   ceiling, not a provider-reported physical limit. When UNSET, the
      #   capacity gate runs in REPORT-ONLY mode and never invents a ceiling.
      #
      #   Do not copy an old plan number here. Set a value only after the operator
      #   has reviewed current provider pricing/limits and deliberately chosen the
      #   threshold. A malformed explicit value fails closed.
      #
      # - key: AXTASK_DB_SIZE_BUDGET_BYTES
      #   value: "<operator-approved-byte-count>"
      # Scheduled/background resource controls — off until operator re-enables.
      # See docs/SCHEDULED_RESOURCE_CONTROLS.md.
      - key: DISABLE_REMINDER_DISPATCH
        value: "true"
      - key: DISABLE_ARCHETYPE_ROLLUP
        value: "true"
      - key: DISABLE_DB_SIZE_SNAPSHOT
        value: "true"
      - key: DISABLE_OPS_SNAPSHOT
        value: "true"

  # Nightly retention sweep for append-only tables (including foundry_run_logs).
  - type: cron
    name: axtask-db-retention
    env: node
    plan: starter
    schedule: "15 4 * * *"  # 04:15 UTC daily
    buildCommand: npm ci
    startCommand: node scripts/db-retention.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
