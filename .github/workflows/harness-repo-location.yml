name: Harness Repository Location Recovery

on:
  pull_request:
    paths:
      - ".ai/**"
      - "scripts/ai-harness/resolve-checkout.mjs"
      - "scripts/ai-harness/operator-preflight.ps1"
      - "scripts/ai-harness/validate-repo-location-recovery.mjs"
      - ".githooks/**"
      - ".github/workflows/harness-repo-location.yml"

permissions:
  contents: read

jobs:
  validate-repo-location:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate authority
        run: node scripts/ai-harness/validate-authority.mjs

      - name: Validate harness
        run: node scripts/ai-harness/validate-harness.mjs

      - name: Validate harness infrastructure
        run: node scripts/ai-harness/validate-harness-infrastructure.mjs

      - name: Prove repository-location recovery
        run: node scripts/ai-harness/validate-repo-location-recovery.mjs

      - name: Execute Windows PowerShell 5.1 operator preflight from non-repository AxTask folder
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Scratch=Join-Path $env:RUNNER_TEMP 'operator-preflight-not-a-repo\AxTask'
          $RelativeArtifact='scripts\ai-harness\resolve-checkout.mjs'
          $WorkspaceArtifact=Join-Path $env:GITHUB_WORKSPACE $RelativeArtifact
          $RecoveredWorktree=$null
          New-Item -ItemType Directory -Force -Path $Scratch | Out-Null
          Push-Location $Scratch
          try {
            $SearchRoot=Split-Path -Parent $env:GITHUB_WORKSPACE
            $Raw=& "$env:GITHUB_WORKSPACE\scripts\ai-harness\operator-preflight.ps1" -SearchRoot $SearchRoot -Fetch -EnsureArtifactWorktree -Json
            $Result=($Raw -join "`n") | ConvertFrom-Json
            if(-not $Result.ok){ throw 'operator preflight did not report ok=true' }
            if($Result.repository -ne 'EndeavorEverlasting/AxTask'){ throw "unexpected repository: $($Result.repository)" }
            if(-not $Result.requiredArtifactAvailable){ throw 'operator preflight did not prove required artifact availability' }
            if([string]::IsNullOrWhiteSpace([string]$Result.selected)){ throw 'operator preflight did not return a selected checkout' }
            if([IO.Path]::GetFullPath($Result.selected) -ne [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)){
              throw "operator preflight resolved unexpected selected checkout: $($Result.selected)"
            }
            if(-not (Test-Path -LiteralPath (Join-Path $Result.selected $RelativeArtifact) -PathType Leaf)){
              throw 'selected checkout does not materialize tracked resolver'
            }

            Remove-Item -LiteralPath $WorkspaceArtifact -Force
            $RawDirty=& "$env:GITHUB_WORKSPACE\scripts\ai-harness\operator-preflight.ps1" -SearchRoot $SearchRoot -Fetch -EnsureArtifactWorktree -Json
            $DirtyResult=($RawDirty -join "`n") | ConvertFrom-Json
            if(-not $DirtyResult.ok -or -not $DirtyResult.requiredArtifactAvailable){ throw 'dirty-checkout recovery did not produce usable artifact proof' }
            if([IO.Path]::GetFullPath($DirtyResult.selected) -eq [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)){
              throw 'deleted materialized artifact was incorrectly accepted from dirty checkout'
            }
            if(-not (Test-Path -LiteralPath (Join-Path $DirtyResult.selected $RelativeArtifact) -PathType Leaf)){
              throw 'exact-SHA recovery worktree does not materialize resolver'
            }
            $RecoveredWorktree=$DirtyResult.selected
          }
          finally {
            Pop-Location
            & git -C $env:GITHUB_WORKSPACE restore -- $RelativeArtifact
            if($LASTEXITCODE -ne 0){ throw 'failed to restore CI fixture artifact' }
            if($RecoveredWorktree -and (Test-Path -LiteralPath $RecoveredWorktree -PathType Container)){
              & git -C $env:GITHUB_WORKSPACE worktree remove --force $RecoveredWorktree
              if($LASTEXITCODE -ne 0){ throw 'failed to remove CI exact-SHA fixture worktree' }
            }
          }

      - name: Check diff whitespace
        if: runner.os == 'Linux'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
