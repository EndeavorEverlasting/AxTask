# Runs tests on main/master and updates docs/TEST_ATTESTATION.md when green.
name: test-and-attest

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: test-and-attest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-attest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axtask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axtask"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axtask
      # Playwright `webServer` runs `npm run start:app` (NODE_ENV=production); server requires this.
      SESSION_SECRET: ci-playwright-session-secret-must-be-at-least-32-chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin the application runtime so provenance approval cannot silently drift.
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Node provenance guard
        run: npm run security:node-provenance-guard

      - name: Node runtime guard
        run: npm run security:node-runtime-guard

      - name: Axios guard
        run: npm run security:axios-guard

      - name: Typecheck
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Release contract guardrail
        run: npm run release:check

      # Playwright `webServer` (see playwright.config.ts) runs `npm run start:app`, which
      # requires `dist/index.js` from the production bundle. Build must precede UI tests.
      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Planner scroll visibility regression (Playwright)
        run: npm run test:ui:planner-scroll

      - name: Client bundle size budget
        env:
          AXTASK_STRICT_CHUNKS: "1"
        run: npm run perf:bundle

      - name: API latency heuristics replay
        run: npm run perf:api-replay

      - name: Bootstrap Drizzle schema, apply SQL migrations, verify idempotent push
        run: |
          npm run db:push:ci </dev/null
          node scripts/apply-migrations.mjs
          npm run db:push:ci </dev/null

      - name: Account backup round-trip certification
        # Uses only the disposable loopback PostgreSQL service above. The runner
        # fails closed for non-loopback/production targets and emits ignored
        # machine-readable proof under .ai/runs/.
        run: node scripts/db/run-local-account-backup-cert.mjs --schema-ready

      - name: Verify users TOTP columns exist in DB
        run: npm run test:pg-schema

      - name: Local production certification
        # Launch the real production entrypoint against the already-prepared disposable
        # PostgreSQL service. The certifier disables bounded-run background workers,
        # probes /health, /ready, and the built client shell, validates runtime-proof,
        # and never contacts Render or Neon.
        env:
          AXTASK_LOCAL_CERT: "1"
          AXTASK_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/deploy/run-local-cert.mjs --schema-ready --build-ready

      - name: Update test attestation
        if: success() && github.event_name == 'push'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/update-test-attestation.mjs

      - name: Commit attestation
        if: success() && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update TEST_ATTESTATION.md [skip ci]"
          file_pattern: docs/TEST_ATTESTATION.md

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker build (root Dockerfile)
        run: docker build -t axtask-ci:check .
      - name: Verify runtime image has bundled app assets
        run: docker run --rm axtask-ci:check sh -c 'test -f dist/index.js && test -f dist/public/index.html && test -f package.json && test -f drizzle.config.ts'

  predeploy-proof:
    needs: [test-and-attest, docker-build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Refresh and verify candidate/base state
        id: state
        run: |
          git fetch origin main --prune --no-tags
          current_candidate="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          current_main="$(git rev-parse origin/main)"
          blocking_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq "[.[] | select(.number != $PR_NUMBER)] | length")"
          test "$current_candidate" = "$CANDIDATE_SHA"
          test "$current_main" = "$BASE_SHA"
          echo "current_candidate=$current_candidate" >> "$GITHUB_OUTPUT"
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          echo "blocking_count=$blocking_count" >> "$GITHUB_OUTPUT"

      - name: Generate fail-closed predeploy proof
        run: >-
          node scripts/ai-harness/generate-predeploy-ci-proof.mjs
          --candidate "$CANDIDATE_SHA"
          --current-candidate "${{ steps.state.outputs.current_candidate }}"
          --base "$BASE_SHA"
          --current-main "${{ steps.state.outputs.current_main }}"
          --blocking-pr-count "${{ steps.state.outputs.blocking_count }}"
          --ci-green true
          --pr "$PR_NUMBER"
          --output-dir ".ai/runs/predeploy-ci-$CANDIDATE_SHA"

      - name: Upload predeploy proof
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-proof-${{ github.event.pull_request.head.sha }}
          path: .ai/runs/predeploy-ci-${{ github.event.pull_request.head.sha }}/
          if-no-files-found: error
          retention-days: 14

  check-nodeweaver-file:
    runs-on: ubuntu-latest
    outputs:
      file_present: ${{ steps.check.outputs.file_present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f services/nodeweaver/upstream/pyproject.toml ]; then
            echo "file_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "file_present=false" >> "$GITHUB_OUTPUT"
          fi

  nodeweaver-pytest:
    needs: [check-nodeweaver-file]
    runs-on: ubuntu-latest
    if: needs.check-nodeweaver-file.outputs.file_present == 'true'
    defaults:
      run:
        working-directory: services/nodeweaver/upstream
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (align with NodeWeaver Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ libasound2-dev portaudio19-dev libsndfile1-dev ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/nodeweaver/upstream/uv.lock"

      - name: Sync Python env and run pytest
        run: |
          uv sync --frozen --extra dev
          uv run python -m pytest
