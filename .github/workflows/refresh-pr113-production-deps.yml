name: refresh-pr113-production-deps

on:
  push:
    branches: [feat/gstack-deploy-skill-harvest-20260807]

permissions:
  contents: write

concurrency:
  group: refresh-pr113-production-deps
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/gstack-deploy-skill-harvest-20260807
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Apply bounded dependency repairs
        run: |
          npm pkg set 'dependencies.drizzle-orm=^0.45.2'
          npm pkg set 'dependencies.express=^4.22.2'
          npm pkg set 'dependencies.express-rate-limit=^8.6.1'
          npm pkg set 'dependencies.multer=^2.2.0'
          npm pkg set 'dependencies.ws=^8.21.1'
          npm pkg set 'devDependencies.postcss=^8.5.23'
          npm pkg delete dependencies.xlsx
          npm install --package-lock-only --ignore-scripts

      - name: Require clean production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate dependency diff
        run: |
          git diff --check
          git diff -- package.json package-lock.json

      - name: Commit repaired manifest and lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifest and lock are already converged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): close production audit blockers"
          git push origin HEAD:feat/gstack-deploy-skill-harvest-20260807
