name: Replit → GitHub Sync

# Force-updates GitHub's `main` to the tip of a source branch that already
# exists on GitHub and contains the desired Replit history.
#
# HOW IT WORKS
# ─────────────
# The Replit agent sandbox cannot git-push directly to GitHub's main.
# The operator workflow is:
#   1. From the Replit Shell, push to a staging branch:
#        git push origin HEAD:refs/heads/replit/main
#   2. This workflow triggers automatically (or run it manually) and
#      force-promotes `replit/main` → `main`.
#
# MANUAL DISPATCH
# ───────────────
# GitHub → Actions → "Replit → GitHub Sync" → Run workflow
# Set `source_branch` to an existing GitHub branch that contains the Replit
# history you want to promote (e.g. "replit/main" or a sprint branch name).
# Do NOT set it to "main" — that would be a no-op.
#
# BRANCH PROTECTION NOTE
# ──────────────────────
# If GitHub's main is branch-protected, ensure the workflow has bypass
# permissions, or add `github-actions[bot]` to the bypass list.

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: >
          Existing GitHub branch to promote to main.
          Must contain the desired Replit history (e.g. replit/main).
          Setting this to "main" is a no-op.
        required: true
        default: "replit/main"

  # Auto-trigger when Replit pushes the staging branch
  push:
    branches:
      - "replit/main"

jobs:
  sync:
    name: Force-update GitHub main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve source branch
        id: vars
        run: |
          # On push events use the pushed branch; on dispatch use the input
          SOURCE="${{ github.event.inputs.source_branch || github.ref_name }}"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Source branch: $SOURCE"

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.source }}
          fetch-depth: 0

      - name: Verify source is not already main
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          if [ "$SOURCE" = "main" ]; then
            echo "ERROR: source_branch is 'main' — this would be a no-op."
            echo "Push the Replit history to 'replit/main' first, then re-run."
            exit 1
          fi
          echo "Source branch '$SOURCE' is valid. Promoting to main..."

      - name: Force-push to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SOURCE="${{ steps.vars.outputs.source }}"
          echo "Promoting refs/heads/$SOURCE → refs/heads/main"
          git push --force origin "HEAD:refs/heads/main"

      - name: Remove stale helper branches
        run: |
          for branch in pre-iron-spine-base; do
            if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
              echo "Deleting stale branch: $branch"
              git push origin --delete "$branch" || true
            fi
          done

      - name: Summary
        run: |
          {
            echo "### Sync complete"
            echo "- Source: \`${{ steps.vars.outputs.source }}\`"
            echo "- GitHub \`main\` now points to: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
