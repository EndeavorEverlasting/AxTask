name: Replit → GitHub Sync

# Triggered manually (workflow_dispatch) from the GitHub UI,
# OR automatically when a branch matching the sprint pattern is pushed.
# It force-updates GitHub's main to the tip of that sprint branch,
# giving future PRs a clean common ancestor.
#
# To trigger manually:
#   GitHub → Actions → "Replit → GitHub Sync" → Run workflow
#   Set source_branch to the branch you want to promote to main.

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to promote to main (default: main)"
        required: false
        default: "main"

  # Auto-trigger when Replit task agents push sprint branches
  push:
    branches:
      - "replit/main"          # convention: Replit pushes here to request a sync

jobs:
  sync:
    name: Force-update GitHub main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch || 'replit/main' }}
          fetch-depth: 0

      - name: Force-push to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SOURCE="${{ github.event.inputs.source_branch || 'replit/main' }}"
          echo "Promoting $SOURCE → main"
          git push --force origin "refs/heads/$SOURCE:refs/heads/main"

      - name: Remove stale helper branches
        run: |
          for branch in pre-iron-spine-base; do
            if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
              echo "Deleting stale branch: $branch"
              git push origin --delete "$branch" || true
            fi
          done

      - name: Summary
        run: |
          echo "### Sync complete" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub \`main\` now points to: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
