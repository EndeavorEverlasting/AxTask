name: PR70 Clean Rebuild

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  rebuild-and-validate:
    if: github.event.pull_request.head.ref == 'fix/2026-07-15-sidebar-wallet-polling-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out clean branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/2026-07-15-sidebar-wallet-polling-clean

      - name: Apply PR70 over current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/reduce-wallet-sidebar-polling
          base="$(git merge-base origin/main origin/fix/reduce-wallet-sidebar-polling)"
          git diff --binary --full-index "$base"..origin/fix/reduce-wallet-sidebar-polling -- \
            client/src/components/layout/sidebar.tsx \
            client/src/components/layout/sidebar.wallet-poll.test.ts \
            docs/releases/2026-06-25-pr70-sidebar-wallet-polling.md \
            > /tmp/pr70.patch
          test -s /tmp/pr70.patch
          git apply --3way --index /tmp/pr70.patch
          python .github/scripts/pr70_repair.py
          git add \
            client/src/components/layout/sidebar.tsx \
            client/src/components/layout/sidebar.wallet-poll.test.ts \
            docs/releases/2026-06-25-pr70-sidebar-wallet-polling.md
          git diff --check --cached

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted wallet polling contract
        run: npx vitest run client/src/components/layout/sidebar.wallet-poll.test.ts

      - name: Release contract
        run: npm run release:check

      - name: Typecheck
        run: npm run check

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit validated rebuild
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr70-clean-rebuild.yml .github/scripts/pr70_repair.py
          git diff --check --cached
          git commit -m "fix(client): stop sidebar wallet polling on idle tabs"
          git push origin HEAD:fix/2026-07-15-sidebar-wallet-polling-clean
