name: Harness Progressive Disclosure

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".ai/**"
      - "scripts/ai-harness/**"
      - "server/ai-harness/**"
      - ".githooks/**"
      - ".github/workflows/harness-progressive-disclosure.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".ai/**"
      - "scripts/ai-harness/**"
      - "server/ai-harness/**"
      - ".githooks/**"
      - ".github/workflows/harness-progressive-disclosure.yml"

jobs:
  progressive-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ai-harness/tokenizer-requirements.txt
      - run: npm ci
      - name: Prove generic test isolation without tokenizer backend
        run: npx --no-install vitest run server/ai-harness/progressive-disclosure-contract.test.ts
      - name: Install exact tokenizer backend
        run: python -m pip install -r scripts/ai-harness/tokenizer-requirements.txt
      - run: node scripts/ai-harness/validate-authority.mjs
      - run: node scripts/ai-harness/validate-progressive-disclosure.mjs
      - name: Measure representative retrieval paths
        run: |
          node scripts/ai-harness/show-context.mjs orientation --measure
          node scripts/ai-harness/show-context.mjs domain repository-harness --measure
          node scripts/ai-harness/show-context.mjs workflow axtask.local-deployment-certification.v1 --measure
      - name: Prove exact tokenizer contract with pinned backend
        run: npx --no-install vitest run server/ai-harness/progressive-disclosure-contract.test.ts
