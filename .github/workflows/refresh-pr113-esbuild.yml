name: refresh-pr113-esbuild

on:
  push:
    branches: [feat/gstack-deploy-skill-harvest-20260807]

permissions:
  contents: write

concurrency:
  group: refresh-pr113-esbuild
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/gstack-deploy-skill-harvest-20260807
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"

      - name: Apply bounded esbuild repair
        run: |
          npm pkg set 'devDependencies.esbuild=0.28.1'
          npm pkg set 'overrides.esbuild=0.28.1'
          npm install --package-lock-only --ignore-scripts

      - name: Require clean production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate dependency diff
        run: |
          git diff --check -- package.json package-lock.json
          git diff -- package.json package-lock.json

      - name: Commit repaired manifest and lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency manifest and lock are already converged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): close remaining production advisories"
          git push origin HEAD:feat/gstack-deploy-skill-harvest-20260807
